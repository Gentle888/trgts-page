<h1>Целимся<span class="dots" aria-hidden="true"><i>.</i><i>.</i><i>.</i></span></h1>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"}}</script>
<script type="module">
import * as THREE from 'three';
import {SVGLoader} from 'three/addons/loaders/SVGLoader.js';
import {RoomEnvironment} from 'three/addons/environments/RoomEnvironment.js';

const D='M251,423.704C251,422.987 250.715,422.299 250.208,421.792C249.701,421.285 249.013,421 248.296,421L220,421L220,388L253,388L253,416.296C253,417.013 253.285,417.701 253.792,418.208C254.299,418.715 254.987,419 255.704,419L284,419L284,452L251,452L251,423.704ZM267.5,425C261.705,425 257,429.705 257,435.5C257,441.295 261.705,446 267.5,446C273.295,446 278,441.295 278,435.5C278,429.705 273.295,425 267.5,425ZM267.5,430.25C270.398,430.25 272.75,432.602 272.75,435.5C272.75,438.398 270.398,440.75 267.5,440.75C264.602,440.75 262.25,438.398 262.25,435.5C262.25,432.602 264.602,430.25 267.5,430.25ZM236.5,394C230.705,394 226,398.705 226,404.5C226,410.295 230.705,415 236.5,415C242.295,415 247,410.295 247,404.5C247,398.705 242.295,394 236.5,394ZM236.5,399.25C239.398,399.25 241.75,401.602 241.75,404.5C241.75,407.398 239.398,409.75 236.5,409.75C233.602,409.75 231.25,407.398 231.25,404.5C231.25,401.602 233.602,399.25 236.5,399.25Z';
const canvas=document.getElementById('stage');
const renderer=new THREE.WebGLRenderer({canvas,antialias:true,alpha:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.toneMapping=THREE.ACESFilmicToneMapping;
const scene=new THREE.Scene();
scene.environment=new THREE.PMREMGenerator(renderer).fromScene(new RoomEnvironment(),.04).texture;
const camera=new THREE.PerspectiveCamera(30,1,.1,100);camera.position.z=10;
const key=new THREE.DirectionalLight(0xffffff,2.2);key.position.set(3,4,6);scene.add(key);

const shapes=new SVGLoader().parse(`<svg><path d="${D}"/></svg>`).paths[0].toShapes(true);
const geo=new THREE.ExtrudeGeometry(shapes,{depth:9,bevelEnabled:true,bevelThickness:1.2,bevelSize:.8,bevelSegments:6,curveSegments:48});
geo.center();geo.scale(1/34,-1/34,1/34);geo.computeVertexNormals();
const mat=new THREE.MeshPhysicalMaterial({color:0xF4EEEE,roughness:.32,metalness:0,clearcoat:.6,clearcoatRoughness:.25});
const mesh=new THREE.Mesh(geo,mat);
const pivot=new THREE.Group();pivot.add(mesh);scene.add(pivot);

const still=matchMedia('(prefers-reduced-motion: reduce)').matches;
let tx=0,ty=0,spin=0,vel=still?0:.35,drag=null;
addEventListener('pointermove',e=>{
  const nx=e.clientX/innerWidth*2-1,ny=e.clientY/innerHeight*2-1;
  tx=nx*.6;ty=ny*.45;
  if(drag){vel=(e.clientX-drag)*.9;drag=e.clientX;}
});
canvas.addEventListener('pointerdown',e=>{drag=e.clientX;canvas.setPointerCapture(e.pointerId);});
addEventListener('pointerup',()=>drag=null);

function size(){
  const w=innerWidth,h=innerHeight;renderer.setSize(w,h,false);camera.aspect=w/h;
  camera.position.z=w<h?9/(w/h)*.55:10;camera.updateProjectionMatrix();
}
addEventListener('resize',size);size();

const clock=new THREE.Clock();
renderer.setAnimationLoop(()=>{
  const dt=Math.min(clock.getDelta(),.05);
  if(!drag) vel+=((still?0:.35)-vel)*(1-Math.exp(-dt*1.5));
  spin+=vel*dt;
  pivot.rotation.y+=(spin+tx-pivot.rotation.y)*(1-Math.exp(-dt*6));
  pivot.rotation.x+=(ty-pivot.rotation.x)*(1-Math.exp(-dt*6));
  pivot.position.y=.3;
  renderer.render(scene,camera);
});
</script>
